name: Build Draft Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: smu-draft-release
  cancel-in-progress: false

jobs:
  build-packages:
    name: Build signed release packages
    uses: ./.github/workflows/build.yml
    with:
      release_mode: true
    secrets: inherit

  draft-release:
    name: Create draft release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare draft release body
        id: release-body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build-packages.outputs.app_version }}"
          previous_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name'
          )"
          if [[ -z "$previous_tag" || "$previous_tag" == "V${version}" ]]; then
            echo "Could not determine the previous published release tag." >&2
            exit 1
          fi
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...V${version}"
          {
            echo 'body<<EOF'
            echo '<!-- TODO: Write release notes here before publishing this draft. -->'
            echo
            echo "Full Changelog: [${previous_tag}...V${version}](${changelog_url})"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: Spencer-Macro-Utilities-*
          path: release-files
          merge-multiple: true
          skip-decompress: true

      - name: Apply V3.4.0 legacy ZIP casing
        if: needs.build-packages.outputs.app_version == '3.4.0'
        shell: bash
        run: |
          version="${{ needs.build-packages.outputs.app_version }}"
          # Stock V3.2 accepts only the exact case-sensitive suffix ".zip" and
          # blindly chooses the first matching release asset. GitHub release
          # JSON does not preserve upload order, so for this one migration
          # release make the non-Windows updater archives invisible to V3.2.
          mv \
            "release-files/Spencer-Macro-Utilities-V${version}-Linux-x86_64.zip" \
            "release-files/Spencer-Macro-Utilities-V${version}-Linux-x86_64.ZIP"
          mv \
            "release-files/Spencer-Macro-Utilities-V${version}-macOS-universal.zip" \
            "release-files/Spencer-Macro-Utilities-V${version}-macOS-universal.ZIP"

      - name: Generate authoritative updater manifest
        shell: bash
        run: |
          python3 scripts/generate_update_manifest.py \
            --release-dir release-files \
            --version "${{ needs.build-packages.outputs.app_version }}" \
            --output release-files/update-manifest.json

      - name: Verify release asset set
        shell: bash
        run: |
          version="${{ needs.build-packages.outputs.app_version }}"
          if [[ "$version" == "3.4.0" ]]; then
            linux_archive="Spencer-Macro-Utilities-V${version}-Linux-x86_64.ZIP"
            macos_archive="Spencer-Macro-Utilities-V${version}-macOS-universal.ZIP"
          else
            linux_archive="Spencer-Macro-Utilities-V${version}-Linux-x86_64.zip"
            macos_archive="Spencer-Macro-Utilities-V${version}-macOS-universal.zip"
          fi
          expected=(
            "Spencer-Macro-Utilities-Windows.zip"
            "Spencer-Macro-Utilities-V${version}-Windows.exe"
            "$linux_archive"
            "$macos_archive"
            "Spencer-Macro-Utilities-V${version}-macOS-universal.dmg"
            "update-manifest.json"
          )
          for asset in "${expected[@]}"; do
            test -s "release-files/$asset"
          done
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          python3 -m json.tool release-files/update-manifest.json >/dev/null

      - name: Clear assets from an existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build-packages.outputs.app_version }}"
          tag="V${version}"
          mapfile -t release_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --paginate \
              --jq ".[] | select(.tag_name == \"${tag}\") | .id"
          )
          if (( ${#release_ids[@]} > 1 )); then
            echo "Refusing to choose between multiple releases tagged ${tag}." >&2
            exit 1
          fi
          release_id="${release_ids[0]:-}"
          if [[ -z "$release_id" ]]; then
            exit 0
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.draft')" != "true" ]]; then
            echo "Refusing to replace assets on the published ${tag} release." >&2
            exit 1
          fi
          mapfile -t asset_ids < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --paginate \
              --jq '.[].id'
          )
          for asset_id in "${asset_ids[@]}"; do
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: Create draft GitHub release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: V${{ needs.build-packages.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          name: Spencer Macro Utilities V${{ needs.build-packages.outputs.app_version }}
          body: ${{ steps.release-body.outputs.body }}
          draft: true
          # The release asset set was verified exactly above. For V3.4.0 the
          # Linux/macOS updater archives have uppercase .ZIP suffixes, making
          # the Windows package the only exact lowercase .zip that stock V3.2
          # can see. We therefore do not rely on GitHub preserving upload order.
          files: release-files/*
          fail_on_unmatched_files: true

      - name: Verify V3.2 legacy updater asset visibility
        if: needs.build-packages.outputs.app_version == '3.4.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build-packages.outputs.app_version }}"
          release_id="${{ steps.create-release.outputs.id }}"
          expected="Spencer-Macro-Utilities-Windows.zip"
          mapfile -t v32_zip_assets < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --jq '.assets[].name | select(endswith(".zip"))'
          )
          if (( ${#v32_zip_assets[@]} != 1 )) || [[ "${v32_zip_assets[0]:-}" != "$expected" ]]; then
            printf 'V3.2 compatibility failed: exact lowercase .zip assets were: %s\n' \
              "${v32_zip_assets[*]:-(none)}" >&2
            exit 1
          fi

          mapfile -t release_assets < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --jq '.assets[].name'
          )
          for expected_asset in \
            "Spencer-Macro-Utilities-V${version}-Linux-x86_64.ZIP" \
            "Spencer-Macro-Utilities-V${version}-macOS-universal.ZIP"; do
            if ! printf '%s\n' "${release_assets[@]}" | grep -Fxq "$expected_asset"; then
              echo "V3.2 compatibility failed: missing release asset $expected_asset" >&2
              exit 1
            fi
          done
