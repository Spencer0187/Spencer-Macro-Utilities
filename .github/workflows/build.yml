name: Build SMU Packages

on:
  workflow_call:
    inputs:
      release_mode:
        description: Require Windows SignPath credentials; macOS uses certificate-free ad-hoc signing.
        required: false
        default: false
        type: boolean
    secrets:
      SIGNPATH_API_TOKEN:
        required: false
      SIGNPATH_ORGANIZATION_ID:
        required: false
      SIGNPATH_PROJECT_SLUG:
        required: false
      SIGNPATH_SIGNING_POLICY:
        required: false
    outputs:
      app_version:
        description: Application version from the canonical version file.
        value: ${{ jobs.prepare.outputs.app_version }}
  workflow_dispatch:
    inputs:
      release_mode:
        description: Require Windows SignPath credentials; macOS is ad-hoc signed.
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  LC_ALL: C.UTF-8
  SOURCE_DATE_EPOCH: '0'
  TZ: UTC

jobs:
  prepare:
    name: Validate package metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          python3 scripts/version.py --check
          app_version="$(python3 scripts/version.py)"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The canonical version is not MAJOR.MINOR.PATCH: $app_version" >&2
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Test version tooling
        run: python3 -m unittest tests.test_version

  linux:
    name: Build Linux bundle
    needs: prepare
    # libei-dev remains required by the C++ compatibility build used by the oracle/tests; it is
    # available in Ubuntu 24.04 but not in the former 22.04 release runner.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up build Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install supported CMake
        run: |
          python -m pip install --disable-pip-version-check 'cmake==3.31.6'
          cmake --version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # nFPM v2.47.0 requires Go 1.26.4. The network helper itself is
          # compatible with this newer compiler despite its older go.mod.
          go-version: '1.26.4'
          cache-dependency-path: platform/linux/nethelper/go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libdecor-0-dev \
            libdbus-1-dev \
            libei-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            ninja-build \
            pkg-config \
            unzip \
            wayland-protocols \
            zip

      - name: Install pinned nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test Linux network helper
        run: |
          cd platform/linux/nethelper
          go test -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Test Rust Linux staging helper
        run: python3 -m unittest tests.test_rust_linux_staging

      - name: Build all Linux formats
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/package_linux_release.sh

      - name: Verify X11 and Wayland SDL backends
        shell: bash
        run: |
          grep -qx 'SDL_X11:BOOL=ON' build/linux-release/CMakeCache.txt
          grep -qx 'SDL_WAYLAND:BOOL=ON' build/linux-release/CMakeCache.txt
          config="$(
            find build/linux-release/rust-cargo-target/release/build/sdl3-sys-* \
              -path '*/build_config/SDL_build_config.h' \
              -print \
              -quit
          )"
          test -n "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_X11 1$' "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND 1$' "$config"

      - name: Verify Wayland ScreenCast support
        shell: bash
        run: |
          grep -qx 'SMU_WAYLAND_SCREENCAST_ENABLED:INTERNAL=ON' \
            build/linux-release/CMakeCache.txt
          grep -qx 'SMU_WAYLAND_EIS_ENABLED:INTERNAL=ON' \
            build/linux-release/CMakeCache.txt
          app=build/linux-release/rust-linux-app/Spencer-Macro-Utilities
          ldd "$app" | grep -q 'libpipewire-0.3.so.0'
          ldd "$app" | grep -q 'rust-linux-app/lib/libSDL3.so.0'
          readelf -d "$app" | grep -F -q '$ORIGIN/lib'

      - name: Test Linux updater
        run: |
          cmake --build build/linux-release --target smu_linux_updater_test --parallel
          ctest --test-dir build/linux-release --output-on-failure -R '^linux-updater$'

      - name: Verify Linux bundle contents
        shell: bash
        run: |
          bundle="dist/release/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-Linux-x86_64.zip"
          unzip -t "$bundle"
          listing="$(unzip -Z1 "$bundle")"
          grep -qx "Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-Linux-x86_64.AppImage" <<<"$listing"
          grep -qx "spencer-macro-utilities_${{ needs.prepare.outputs.app_version }}_amd64.deb" <<<"$listing"
          grep -qx "spencer-macro-utilities-${{ needs.prepare.outputs.app_version }}-1.x86_64.rpm" <<<"$listing"
          grep -qx "Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-Linux-x86_64-portable.tar.gz" <<<"$listing"
          grep -qx "LINUX_SETUP.md" <<<"$listing"
          grep -qx "LICENSE" <<<"$listing"
          grep -qx "PRIVACY.md" <<<"$listing"
          grep -qx "THIRD_PARTY_NOTICES.md" <<<"$listing"
          grep -qx "licenses/SDL.txt" <<<"$listing"
          grep -qx "licenses/AppImage-type2-runtime.txt" <<<"$listing"
          grep -qx "licenses/go-iptables-LICENSE.txt" <<<"$listing"
          grep -qx "licenses/go-iptables-NOTICE.txt" <<<"$listing"
          grep -qx "licenses/WinDivert-LGPL-3.0.txt" <<<"$listing"
          grep -qx "SHA256SUMS" <<<"$listing"

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v7
        with:
          name: Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-Linux-x86_64.zip
          path: dist/release/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-Linux-x86_64.zip
          archive: false
          if-no-files-found: error

  nix:
    name: Validate Nix package and module
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check locked flake
        run: nix flake check --no-update-lock-file --print-build-logs

  windows:
    name: Build Windows package
    needs: prepare
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Require SignPath release credentials
        if: inputs.release_mode
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
        run: |
          $missing = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY'
          ) | Where-Object { -not (Get-Item "env:$_").Value }
          if ($missing.Count -gt 0) {
            throw "Missing SignPath release secrets: $($missing -join ', ')"
          }

      - name: Configure Windows build
        run: cmake -S . -B build/windows -G "Visual Studio 18 2026" -A x64

      - name: Build Windows app
        run: cmake --build build/windows --config Release --target spencer_macro_utilities --parallel

      - name: Upload unsigned executable for SignPath
        if: inputs.release_mode
        id: signpath-input
        uses: actions/upload-artifact@v7
        with:
          name: signpath-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows/Release/Spencer-Macro-Utilities.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign executable with SignPath
        if: inputs.release_mode
        uses: signpath/github-action-submit-signing-request@v2
        with:
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          github-artifact-id: ${{ steps.signpath-input.outputs.artifact-id }}
          github-token: ${{ github.token }}
          artifact-configuration-slug: initial
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Stage Windows packages
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.app_version }}'
          $versionedName = "Spencer-Macro-Utilities-V${version}-Windows.exe"
          $portableArchive = 'release-files/Spencer-Macro-Utilities-Windows.zip'

          Remove-Item release-files -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release-files | Out-Null
          if ('${{ inputs.release_mode }}' -eq 'true') {
            $executable = Get-ChildItem signed -Filter Spencer-Macro-Utilities.exe -File -Recurse |
              Select-Object -First 1
            if (-not $executable) {
              throw 'SignPath did not return Spencer-Macro-Utilities.exe.'
            }
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "SignPath signature validation failed: $($signature.Status)"
            }
          } else {
            $executable = Get-Item build/windows/Release/Spencer-Macro-Utilities.exe
          }

          $stageRoot = 'build/windows-release'
          Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue

          # V3.4.0-ONLY LEGACY BRIDGE:
          # Old V3.0-V3.3.x Windows updaters require a root-level suspend.exe.
          # For this one release, the normal Windows ZIP itself is the bridge.
          # V3.4.0 renames/relaunches itself before GUI initialization. As soon
          # as the project version becomes 3.4.1, this branch is no longer used
          # and the normal versioned nested layout below becomes the only format.
          if ($version -eq '3.4.0') {
            $stage = $stageRoot
            $packagedExeName = 'suspend.exe'
          } else {
            $stage = "$stageRoot/Spencer-Macro-Utilities"
            $packagedExeName = $versionedName
          }

          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $executable.FullName "$stage/$packagedExeName"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          Copy-Item PRIVACY.md "$stage/PRIVACY.md"
          Copy-Item THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"
          New-Item -ItemType Directory -Force "$stage/licenses" | Out-Null
          Copy-Item third_party/SDL/LICENSE.txt "$stage/licenses/SDL.txt"
          Copy-Item `
            third_party/appimage-runtime/LICENSE `
            "$stage/licenses/AppImage-type2-runtime.txt"
          Copy-Item `
            platform/linux/nethelper/vendor/github.com/coreos/go-iptables/LICENSE `
            "$stage/licenses/go-iptables-LICENSE.txt"
          Copy-Item `
            platform/linux/nethelper/vendor/github.com/coreos/go-iptables/NOTICE `
            "$stage/licenses/go-iptables-NOTICE.txt"
          Copy-Item `
            third_party/windivert/LICENSE-LGPL-3.0.txt `
            "$stage/licenses/WinDivert-LGPL-3.0.txt"

          function New-ZipWithForwardSlashEntries {
            param(
              [Parameter(Mandatory = $true)][string]$SourceDirectory,
              [Parameter(Mandatory = $true)][string]$DestinationPath,
              [string]$EntryPrefix = ''
            )

            Add-Type -AssemblyName System.IO.Compression
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [IO.Compression.ZipFile]::Open(
              $DestinationPath,
              [IO.Compression.ZipArchiveMode]::Create
            )
            try {
              $root = (Resolve-Path -LiteralPath $SourceDirectory).Path.TrimEnd('\', '/')
              foreach ($file in Get-ChildItem -LiteralPath $root -File -Recurse) {
                $relativePath = $file.FullName.Substring($root.Length).TrimStart('\', '/').Replace('\', '/')
                $entryName = if ([string]::IsNullOrEmpty($EntryPrefix)) {
                  $relativePath
                } else {
                  "$EntryPrefix/$relativePath"
                }
                $entry = $archive.CreateEntry(
                  $entryName,
                  [IO.Compression.CompressionLevel]::Optimal
                )
                $input = [IO.File]::OpenRead($file.FullName)
                $output = $entry.Open()
                try {
                  $input.CopyTo($output)
                } finally {
                  $output.Dispose()
                  $input.Dispose()
                }
              }
            } finally {
              $archive.Dispose()
            }
          }

          if ($version -eq '3.4.0') {
            New-ZipWithForwardSlashEntries `
              -SourceDirectory $stageRoot `
              -DestinationPath $portableArchive
          } else {
            New-ZipWithForwardSlashEntries `
              -SourceDirectory $stage `
              -DestinationPath $portableArchive `
              -EntryPrefix 'Spencer-Macro-Utilities'
          }

          # The direct download is always correctly branded/versioned, including V3.4.0.
          Copy-Item $executable.FullName "release-files/$versionedName"

      - name: Verify signed Windows packages
        if: inputs.release_mode
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.app_version }}'
          $versionedName = "Spencer-Macro-Utilities-V${version}-Windows.exe"

          $verifyDir = 'build/windows-release-verify'
          Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive 'release-files/Spencer-Macro-Utilities-Windows.zip' $verifyDir

          if ($version -eq '3.4.0') {
            # V3.4.0-only compatibility layout. The executable is the same signed
            # bytes as the direct download, temporarily exposed as suspend.exe.
            $packageRoot = $verifyDir
            $packagedExe = "$verifyDir/suspend.exe"
            if (Test-Path -LiteralPath "$verifyDir/Spencer-Macro-Utilities" -PathType Container) {
              throw 'V3.4.0 Windows ZIP must use the root-level legacy layout.'
            }
          } else {
            $packageRoot = "$verifyDir/Spencer-Macro-Utilities"
            $packagedExe = "$packageRoot/$versionedName"
            if (Test-Path -LiteralPath "$verifyDir/suspend.exe" -PathType Leaf) {
              throw 'suspend.exe must not appear in the V3.4.1+ Windows ZIP.'
            }
          }

          $signature = Get-AuthenticodeSignature $packagedExe
          if ($signature.Status -ne 'Valid') {
            throw "Packaged executable signature validation failed: $($signature.Status)"
          }
          @(
            'LICENSE',
            'PRIVACY.md',
            'THIRD_PARTY_NOTICES.md',
            'licenses/SDL.txt',
            'licenses/AppImage-type2-runtime.txt',
            'licenses/go-iptables-LICENSE.txt',
            'licenses/go-iptables-NOTICE.txt',
            'licenses/WinDivert-LGPL-3.0.txt'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath "$packageRoot/$_" -PathType Leaf)) {
              throw "Packaged notice is missing: $_"
            }
          }

          $directSignature = Get-AuthenticodeSignature "release-files/$versionedName"
          if ($directSignature.Status -ne 'Valid') {
            throw "Standalone executable signature validation failed: $($directSignature.Status)"
          }

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Spencer-Macro-Utilities-Windows.zip
          path: release-files/Spencer-Macro-Utilities-Windows.zip
          archive: false
          if-no-files-found: error

      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-Windows.exe
          path: release-files/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-Windows.exe
          archive: false
          if-no-files-found: error

  macos:
    name: Build universal macOS package
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install pinned Rust toolchain and universal macOS targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Rust universal app, ZIP, and DMG without a release certificate
        env:
          SMU_MACOS_SIGN_IDENTITY: '-'
        run: bash scripts/package_rust_macos_release.sh

      - name: Verify universal ad-hoc-signed Rust app
        shell: bash
        run: |
          app="out/build/macos-universal-release/package-macos/Spencer Macro Utilities.app"
          binary="$app/Contents/MacOS/Spencer-Macro-Utilities"
          architectures="$(lipo -archs "$binary")"
          grep -qw arm64 <<<"$architectures"
          grep -qw x86_64 <<<"$architectures"
          plist="$app/Contents/Info.plist"
          [[ "$(plutil -extract CFBundleName raw -o - "$plist")" == "Spencer Macro Utilities" ]]
          [[ "$(plutil -extract CFBundleDisplayName raw -o - "$plist")" == "Spencer Macro Utilities" ]]
          [[ "$(plutil -extract CFBundleExecutable raw -o - "$plist")" == "Spencer-Macro-Utilities" ]]
          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" == "com.spencer0187.smu" ]]
          [[ "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" == "${{ needs.prepare.outputs.app_version }}" ]]
          [[ "$(plutil -extract CFBundleVersion raw -o - "$plist")" == "${{ needs.prepare.outputs.app_version }}" ]]
          test ! -e "$app/Contents/MacOS/suspend"
          test -x "$app/Contents/MacOS/SMU-Update-Helper"
          test -f "$app/Contents/MacOS/assets/LSANS.TTF"
          test -f "$app/Contents/MacOS/assets/macro_tutorials/wallhop.jpg"
          test -f "$app/Contents/Resources/smu_icon.icns"
          sdl="$(find "$app/Contents/Frameworks" -maxdepth 1 -type f -name 'libSDL3*.dylib' -print -quit)"
          test -n "$sdl"
          for code in "$binary" "$app/Contents/MacOS/SMU-Update-Helper" "$sdl"; do
            code_archs="$(lipo -archs "$code")"
            grep -qw arm64 <<<"$code_archs"
            grep -qw x86_64 <<<"$code_archs"
          done
          otool -L "$binary" | grep -F -q '@rpath/libSDL3'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -F -q 'Signature=adhoc'
          test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Resources/PRIVACY.md"
          test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "$app/Contents/Resources/licenses/SDL.txt"
          test -f "$app/Contents/Resources/licenses/AppImage-type2-runtime.txt"
          test -f "$app/Contents/Resources/licenses/WinDivert-LGPL-3.0.txt"

      - name: Name macOS release assets
        shell: bash
        run: |
          mkdir -p release-files
          package_dir="out/build/macos-universal-release/package-macos"
          cp \
            "$package_dir/SpencerMacroUtilities-macOS-universal.zip" \
            "release-files/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-macOS-universal.zip"
          dmg_path="$package_dir/SpencerMacroUtilities-macOS-universal.dmg"
          if [[ -f "$dmg_path" ]]; then
            cp \
              "$dmg_path" \
              "release-files/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-macOS-universal.dmg"
          elif [[ "${{ inputs.release_mode }}" == "true" ]]; then
            echo "The macOS DMG is required for release, but packaging did not produce it." >&2
            exit 1
          else
            echo "The macOS DMG was unavailable; continuing with the ZIP validation artifact."
          fi

      - name: Verify macOS DMG integrity
        shell: bash
        run: |
          dmg="release-files/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-macOS-universal.dmg"
          if [[ -f "$dmg" ]]; then
            hdiutil verify "$dmg"
          elif [[ "${{ inputs.release_mode }}" == "true" ]]; then
            echo "The macOS release has no DMG to verify." >&2
            exit 1
          fi

      - name: Upload macOS ZIP release asset
        uses: actions/upload-artifact@v7
        with:
          name: Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-macOS-universal.zip
          path: release-files/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-macOS-universal.zip
          archive: false
          if-no-files-found: error

      - name: Upload macOS DMG release asset
        if: ${{ hashFiles(format('release-files/Spencer-Macro-Utilities-V{0}-macOS-universal.dmg', needs.prepare.outputs.app_version)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-macOS-universal.dmg
          path: release-files/Spencer-Macro-Utilities-V${{ needs.prepare.outputs.app_version }}-macOS-universal.dmg
          archive: false
          if-no-files-found: error
