name: Rust rewrite checks

on:
  push:
    branches:
      - rewrite/rust
    paths:
      - "rust/**"
      - "compat/**"
      - "assets/**"
      - "version"
      - "LICENSE"
      - "PRIVACY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - "scripts/package_rust_macos_release.sh"
      - "scripts/stage_rust_windows_app.py"
      - "scripts/stage_rust_macos_app.py"
      - "scripts/package_rust_windows_bundle.py"
      - "scripts/prepare_rust_windows_signpath.py"
      - "scripts/signpath/rust-windows-bundle.xml"
      - "scripts/generate_update_manifest.py"
      - "tests/test_rust_windows_staging.py"
      - "tests/test_rust_windows_signpath.py"
      - "tests/test_rust_macos_staging.py"
      - "tests/test_rust_macos_process.py"
      - "tests/test_rust_macos_input.py"
      - "tests/test_rust_macos_display.py"
      - "tests/test_rust_macos_app.py"
      - "tests/test_rust_macos_updater.py"
      - "tests/test_update_manifest.py"
      - "docs/RUST_REWRITE.md"
      - ".github/workflows/rust-rewrite.yml"
  pull_request:
    paths:
      - "rust/**"
      - "compat/**"
      - "assets/**"
      - "version"
      - "LICENSE"
      - "PRIVACY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - "scripts/package_rust_macos_release.sh"
      - "scripts/stage_rust_windows_app.py"
      - "scripts/stage_rust_macos_app.py"
      - "scripts/package_rust_windows_bundle.py"
      - "scripts/prepare_rust_windows_signpath.py"
      - "scripts/signpath/rust-windows-bundle.xml"
      - "scripts/generate_update_manifest.py"
      - "tests/test_rust_windows_staging.py"
      - "tests/test_rust_windows_signpath.py"
      - "tests/test_rust_macos_staging.py"
      - "tests/test_rust_macos_process.py"
      - "tests/test_rust_macos_input.py"
      - "tests/test_rust_macos_display.py"
      - "tests/test_rust_macos_app.py"
      - "tests/test_rust_macos_updater.py"
      - "tests/test_update_manifest.py"
      - "docs/RUST_REWRITE.md"
      - ".github/workflows/rust-rewrite.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.0
      - name: macOS native-adapter source-contract tests
        working-directory: .
        run: python3 -m unittest tests.test_rust_macos_process tests.test_rust_macos_input tests.test_rust_macos_display tests.test_rust_macos_app tests.test_rust_macos_updater
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy compatibility/core crates
        run: cargo clippy --workspace --exclude smu-app --all-targets -- -D warnings
      - name: Test compatibility/core crates
        run: cargo test --workspace --exclude smu-app
      - name: Check SDL3 + Dear ImGui application spike
        run: cargo check -p smu-app
      - name: Clippy SDL3 + Dear ImGui application spike
        run: cargo clippy -p smu-app --all-targets -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.9
      - name: Dependency policy
        run: cargo deny check

  macos-native-adapters:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.0
      - name: Install universal Apple Rust targets
        run: rustup target add --toolchain 1.98.0 aarch64-apple-darwin x86_64-apple-darwin
      - name: Test Rust macOS staging contract
        working-directory: .
        run: python3 -m unittest tests.test_rust_macos_staging tests.test_rust_macos_updater
      - name: Test native macOS process/input/display/updater adapters, helper, and app composition
        run: cargo test -p smu-process -p smu-input -p smu-display -p smu-updater -p smu-macos-updater-helper -p smu-app
      - name: Clippy native macOS process/input/display/updater adapters, helper, and app composition
        run: cargo clippy -p smu-process -p smu-input -p smu-display -p smu-updater -p smu-macos-updater-helper -p smu-app --all-targets -- -D warnings
      - name: Stage certificate-free universal Rust macOS app
        working-directory: .
        shell: bash
        run: |
          python3 scripts/stage_rust_macos_app.py \
            --root . \
            --target-dir build/rust-macos-target \
            --bundle "build/rust-macos-app/Spencer Macro Utilities.app" \
            --profile release \
            --sign-identity -
      - name: Validate universal Rust macOS app signer and runtime layout
        working-directory: .
        shell: bash
        run: |
          app="build/rust-macos-app/Spencer Macro Utilities.app"
          binary="$app/Contents/MacOS/Spencer-Macro-Utilities"
          helper="$app/Contents/MacOS/SMU-Update-Helper"
          sdl="$(find "$app/Contents/Frameworks" -maxdepth 1 -type f -name 'libSDL3*.dylib' -print -quit)"
          test -n "$sdl"
          for code in "$binary" "$helper" "$sdl"; do
            architectures="$(lipo -archs "$code")"
            grep -qw arm64 <<<"$architectures"
            grep -qw x86_64 <<<"$architectures"
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          plist="$app/Contents/Info.plist"
          version="$(tr -d '\r\n' < version)"
          [[ "$(plutil -extract CFBundleExecutable raw -o - "$plist")" == "Spencer-Macro-Utilities" ]]
          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" == "com.spencer0187.smu" ]]
          [[ "$(plutil -extract CFBundleIconFile raw -o - "$plist")" == "smu_icon.icns" ]]
          [[ "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" == "$version" ]]
          [[ "$(plutil -extract CFBundleVersion raw -o - "$plist")" == "$version" ]]
          [[ "$(plutil -extract LSMinimumSystemVersion raw -o - "$plist")" == "10.15" ]]
          otool -L "$binary" | grep -F -q '@rpath/libSDL3'
          if otool -L "$helper" | grep -F -q 'libSDL3'; then
            echo "Rust macOS update helper unexpectedly links SDL3." >&2
            exit 1
          fi
          otool -l "$binary" | grep -A3 'cmd LC_RPATH' | grep -F -q '@executable_path/../Frameworks'
          test -f "$app/Contents/MacOS/assets/LSANS.TTF"
          test -f "$app/Contents/MacOS/assets/macro_tutorials/wallhop.jpg"
          test -f "$app/Contents/Resources/smu_icon.icns"
          test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Resources/PRIVACY.md"
          test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          codesign -dvv "$app" 2>&1 | grep -F -q 'Signature=adhoc'
      - name: Package Rust macOS updater ZIP and validation manifest
        working-directory: .
        shell: bash
        run: |
          version="$(tr -d '\r\n' < version)"
          asset="$(python3 - "$version" <<'PY'
          import sys
          from scripts.generate_update_manifest import official_update_assets
          print(official_update_assets(sys.argv[1])["macos-universal"])
          PY
          )"
          release_dir="build/rust-macos-release"
          mkdir -p "$release_dir"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/rust-macos-app/Spencer Macro Utilities.app" \
            "$release_dir/$asset"
          python3 scripts/generate_update_manifest.py \
            --release-dir "$release_dir" \
            --version "$version" \
            --output "$release_dir/update-manifest.json" \
            --only-platform macos-universal
          python3 - "$release_dir/update-manifest.json" "$asset" <<'PY'
          import json
          from pathlib import Path
          import sys
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          artifact = manifest["artifacts"]["macos-universal"]
          assert artifact["asset"] == sys.argv[2]
          assert artifact["size"] > 0
          assert len(artifact["sha256"]) == 64
          PY
          unzip -t "$release_dir/$asset"
          unzip -Z1 "$release_dir/$asset" | grep -F -q 'Spencer Macro Utilities.app/Contents/Info.plist'
      - name: Upload ad-hoc Rust macOS validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-macos-universal-test-adhoc
          path: |
            build/rust-macos-release/Spencer-Macro-Utilities-V*-macOS-universal.*
            build/rust-macos-release/update-manifest.json
          if-no-files-found: error

  windows-rust-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.0
      - name: Windows Rust packaging/manifest unit tests
        run: python -m unittest tests.test_rust_windows_staging tests.test_rust_windows_signpath tests.test_update_manifest
      - name: Stage experimental Windows Rust application
        run: >-
          python scripts/stage_rust_windows_app.py
          --root .
          --target-dir build/rust-windows-target
          --stage-dir build/rust-windows-app
          --profile release
      - name: Expose staged runtime DLLs to Windows test executables
        shell: pwsh
        run: |
          $runtime = (Resolve-Path -LiteralPath 'build/rust-windows-app').Path
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $runtime
      - name: Test Windows Rust application and updater
        id: windows-rust-tests
        run: cargo test --manifest-path rust/Cargo.toml -p smu-app -p smu-updater -p smu-windows-updater-helper
      - name: Clippy Windows Rust application and updater
        if: ${{ !cancelled() && steps.windows-rust-tests.outcome != 'skipped' }}
        run: cargo clippy --manifest-path rust/Cargo.toml -p smu-app -p smu-updater -p smu-windows-updater-helper --all-targets -- -D warnings
      - name: Prepare unsigned four-file SignPath candidate request (never submitted)
        run: >-
          python scripts/prepare_rust_windows_signpath.py
          --stage-dir build/rust-windows-app
          --output build/rust-windows-release/signpath-rust-user-mode-unsigned.zip
      - name: Validate staged runtime siblings and PE metadata
        shell: pwsh
        run: |
          $app = "build/rust-windows-app/Spencer-Macro-Utilities.exe"
          $helper = "build/rust-windows-app/SMU-Update-Helper.exe"
          $required = @(
            $app,
            $helper,
            "build/rust-windows-app/SDL3.dll",
            "build/rust-windows-app/SMCWinDivert.dll",
            "build/rust-windows-app/SMCWinDivert64.sys",
            "build/rust-windows-app/assets/LSANS.TTF"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing staged Rust Windows runtime file: $path"
            }
          }
          $expectedVersion = (Get-Content -Raw version).Trim()
          $version = (Get-Item -LiteralPath $app).VersionInfo
          if ($version.CompanyName -ne "Spencer's Open Source Macro Industries") {
            throw "Unexpected CompanyName: $($version.CompanyName)"
          }
          if ($version.FileDescription -ne "Spencer Macro Utilities") {
            throw "Unexpected FileDescription: $($version.FileDescription)"
          }
          if ($version.FileVersion -ne $expectedVersion) {
            throw "Unexpected FileVersion: $($version.FileVersion)"
          }
          if ($version.ProductName -ne "Spencer Macro Utilities") {
            throw "Unexpected ProductName: $($version.ProductName)"
          }
          if ($version.ProductVersion -ne $expectedVersion) {
            throw "Unexpected ProductVersion: $($version.ProductVersion)"
          }
          $expectedOriginal = "Spencer-Macro-Utilities-V$expectedVersion-Windows.exe"
          if ($version.OriginalFilename -ne $expectedOriginal) {
            throw "Unexpected OriginalFilename: $($version.OriginalFilename)"
          }
          $helperVersion = (Get-Item -LiteralPath $helper).VersionInfo
          if ($helperVersion.FileDescription -ne "Spencer Macro Utilities Update Helper") {
            throw "Unexpected helper FileDescription: $($helperVersion.FileDescription)"
          }
          if ($helperVersion.FileVersion -ne $expectedVersion) {
            throw "Unexpected helper FileVersion: $($helperVersion.FileVersion)"
          }
          $expectedHelperOriginal = "SMU-Update-Helper-V$expectedVersion-Windows.exe"
          if ($helperVersion.OriginalFilename -ne $expectedHelperOriginal) {
            throw "Unexpected helper OriginalFilename: $($helperVersion.OriginalFilename)"
          }
      - name: Configure ephemeral Rust Windows test signing identity
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=SMU Rust Rewrite CI" `
            -FriendlyName "SMU Rust Rewrite CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy NonExportable `
            -HashAlgorithm SHA256 `
            -KeyLength 2048 `
            -NotAfter (Get-Date).AddDays(7)
          if ($null -eq $cert) {
            throw "Could not create the ephemeral Rust Windows test signing certificate."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "smu-rust-rewrite-ci.cer"
          Export-Certificate -Cert $cert -FilePath $certPath | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT=$($cert.Thumbprint)"
      - name: Test-sign staged Rust Windows user-mode runtime
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw "Could not find the Windows SDK signtool.exe."
          }
          $releaseFiles = @(
            "build/rust-windows-app/Spencer-Macro-Utilities.exe",
            "build/rust-windows-app/SMU-Update-Helper.exe",
            "build/rust-windows-app/SDL3.dll",
            "build/rust-windows-app/SMCWinDivert.dll"
          )
          foreach ($path in $releaseFiles) {
            & $signtool.FullName sign /fd SHA256 /sha1 $env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT /s My $path
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed to test-sign $path."
            }
          }
      - name: Validate test-signed Windows runtime trust classes
        shell: pwsh
        run: |
          $releaseFiles = @(
            "build/rust-windows-app/Spencer-Macro-Utilities.exe",
            "build/rust-windows-app/SMU-Update-Helper.exe",
            "build/rust-windows-app/SDL3.dll",
            "build/rust-windows-app/SMCWinDivert.dll"
          )
          foreach ($path in $releaseFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Test-signed Rust Windows runtime failed Authenticode validation: $path ($($signature.Status))"
            }
            if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT) {
              throw "Rust Windows runtime signer did not match the ephemeral test certificate: $path"
            }
          }
          $driver = "build/rust-windows-app/SMCWinDivert64.sys"
          $driverSignature = Get-AuthenticodeSignature -LiteralPath $driver
          if ($driverSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or $null -eq $driverSignature.SignerCertificate) {
            throw "Bundled WinDivert driver does not carry a valid upstream Authenticode signature: $($driverSignature.Status)"
          }
          if ($driverSignature.SignerCertificate.Thumbprint -eq $env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT) {
            throw "Bundled WinDivert driver was unexpectedly re-signed with the SMU test certificate."
          }
      - name: Package test-signed Rust Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/rust-windows-release | Out-Null
          $bundle = "build/rust-windows-release/Spencer-Macro-Utilities-Rust-Windows-test-signed.zip"
          python scripts/package_rust_windows_bundle.py `
            --root . `
            --stage-dir build/rust-windows-app `
            --output $bundle
          $version = (Get-Content -Raw version).Trim()
          $assetName = Split-Path -Leaf $bundle
          python scripts/generate_update_manifest.py `
            --release-dir build/rust-windows-release `
            --version $version `
            --output build/rust-windows-release/update-manifest-rust-windows.json `
            --windows-asset $assetName `
            --only-platform windows-x64
      - name: Validate test-signed Rust Windows release bundle contract
        shell: pwsh
        run: |
          $bundle = "build/rust-windows-release/Spencer-Macro-Utilities-Rust-Windows-test-signed.zip"
          $verify = "build/rust-windows-release-verify"
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $bundle -DestinationPath $verify
          $root = "$verify/Spencer-Macro-Utilities"
          @(
            "$root/Spencer-Macro-Utilities.exe",
            "$root/SMU-Update-Helper.exe",
            "$root/SDL3.dll",
            "$root/SMCWinDivert.dll",
            "$root/SMCWinDivert64.sys",
            "$root/assets/LSANS.TTF",
            "$root/README.md",
            "$root/LICENSE",
            "$root/PRIVACY.md",
            "$root/THIRD_PARTY_NOTICES.md",
            "$root/licenses/SDL.txt",
            "$root/licenses/WinDivert-LGPL-3.0.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Missing Rust Windows release-bundle file: $_"
            }
          }
          @(
            "$root/Spencer-Macro-Utilities.exe",
            "$root/SMU-Update-Helper.exe",
            "$root/SDL3.dll",
            "$root/SMCWinDivert.dll"
          ) | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                $null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT) {
              throw "Packaged Rust Windows release-signed runtime failed signer validation: $_"
            }
          }
          $packagedDriverSignature = Get-AuthenticodeSignature -LiteralPath "$root/SMCWinDivert64.sys"
          if ($packagedDriverSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $null -eq $packagedDriverSignature.SignerCertificate -or
              $packagedDriverSignature.SignerCertificate.Thumbprint -eq $env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT) {
            throw "Packaged WinDivert driver did not preserve its valid upstream signer."
          }
          $manifest = Get-Content -Raw build/rust-windows-release/update-manifest-rust-windows.json | ConvertFrom-Json
          $artifact = $manifest.artifacts.'windows-x64'
          if ($artifact.asset -ne (Split-Path -Leaf $bundle)) {
            throw "Rust Windows validation manifest references the wrong asset: $($artifact.asset)"
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()
          if ($artifact.sha256 -ne $actualHash) {
            throw "Rust Windows validation manifest SHA-256 does not match the bundle."
          }
      - name: Remove ephemeral Rust Windows test signing identity
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\Root\$env:SMU_RUST_WINDOWS_TEST_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
      - name: Upload test-signed Rust Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-app-test-signed
          path: build/rust-windows-app
          if-no-files-found: error
      - name: Upload test-signed Rust Windows release-contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-release-contract-test-signed
          path: build/rust-windows-release
          if-no-files-found: error
