name: Rust rewrite checks

on:
  push:
    branches:
      - rewrite/rust
    paths:
      - "rust/**"
      - "compat/**"
      - "scripts/stage_rust_windows_app.py"
      - "scripts/package_rust_windows_bundle.py"
      - "scripts/generate_update_manifest.py"
      - "tests/test_rust_windows_staging.py"
      - "tests/test_rust_macos_process.py"
      - "tests/test_rust_macos_input.py"
      - "tests/test_update_manifest.py"
      - "docs/RUST_REWRITE.md"
      - ".github/workflows/rust-rewrite.yml"
  pull_request:
    paths:
      - "rust/**"
      - "compat/**"
      - "scripts/stage_rust_windows_app.py"
      - "scripts/package_rust_windows_bundle.py"
      - "scripts/generate_update_manifest.py"
      - "tests/test_rust_windows_staging.py"
      - "tests/test_rust_macos_process.py"
      - "tests/test_rust_macos_input.py"
      - "tests/test_update_manifest.py"
      - "docs/RUST_REWRITE.md"
      - ".github/workflows/rust-rewrite.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.0
      - name: macOS native-adapter source-contract tests
        working-directory: .
        run: python3 -m unittest tests.test_rust_macos_process tests.test_rust_macos_input
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy compatibility/core crates
        run: cargo clippy --workspace --exclude smu-app --all-targets -- -D warnings
      - name: Test compatibility/core crates
        run: cargo test --workspace --exclude smu-app
      - name: Check SDL3 + Dear ImGui application spike
        run: cargo check -p smu-app
      - name: Clippy SDL3 + Dear ImGui application spike
        run: cargo clippy -p smu-app --all-targets -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.9
      - name: Dependency policy
        run: cargo deny check

  macos-native-adapters:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.0
      - name: Test native macOS process/input adapters
        run: cargo test -p smu-process -p smu-input
      - name: Clippy native macOS process/input adapters
        run: cargo clippy -p smu-process -p smu-input --all-targets -- -D warnings

  windows-rust-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.0
      - name: Windows Rust packaging/manifest unit tests
        run: python -m unittest tests.test_rust_windows_staging tests.test_update_manifest
      - name: Test Windows Rust application and updater
        run: cargo test --manifest-path rust/Cargo.toml -p smu-app -p smu-updater -p smu-windows-updater-helper
      - name: Clippy Windows Rust application and updater
        run: cargo clippy --manifest-path rust/Cargo.toml -p smu-app -p smu-updater -p smu-windows-updater-helper --all-targets -- -D warnings
      - name: Stage experimental unsigned Windows Rust application
        run: >-
          python scripts/stage_rust_windows_app.py
          --root .
          --target-dir build/rust-windows-target
          --stage-dir build/rust-windows-app
          --profile release
      - name: Validate staged runtime siblings and PE metadata
        shell: pwsh
        run: |
          $app = "build/rust-windows-app/Spencer-Macro-Utilities.exe"
          $helper = "build/rust-windows-app/SMU-Update-Helper.exe"
          $required = @(
            $app,
            $helper,
            "build/rust-windows-app/SDL3.dll",
            "build/rust-windows-app/SMCWinDivert.dll",
            "build/rust-windows-app/SMCWinDivert64.sys",
            "build/rust-windows-app/assets/LSANS.TTF"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing staged Rust Windows runtime file: $path"
            }
          }
          $expectedVersion = (Get-Content -Raw version).Trim()
          $version = (Get-Item -LiteralPath $app).VersionInfo
          if ($version.CompanyName -ne "Spencer's Open Source Macro Industries") {
            throw "Unexpected CompanyName: $($version.CompanyName)"
          }
          if ($version.FileDescription -ne "Spencer Macro Utilities") {
            throw "Unexpected FileDescription: $($version.FileDescription)"
          }
          if ($version.FileVersion -ne $expectedVersion) {
            throw "Unexpected FileVersion: $($version.FileVersion)"
          }
          if ($version.ProductName -ne "Spencer Macro Utilities") {
            throw "Unexpected ProductName: $($version.ProductName)"
          }
          if ($version.ProductVersion -ne $expectedVersion) {
            throw "Unexpected ProductVersion: $($version.ProductVersion)"
          }
          $expectedOriginal = "Spencer-Macro-Utilities-V$expectedVersion-Windows.exe"
          if ($version.OriginalFilename -ne $expectedOriginal) {
            throw "Unexpected OriginalFilename: $($version.OriginalFilename)"
          }
          $helperVersion = (Get-Item -LiteralPath $helper).VersionInfo
          if ($helperVersion.FileDescription -ne "Spencer Macro Utilities Update Helper") {
            throw "Unexpected helper FileDescription: $($helperVersion.FileDescription)"
          }
          if ($helperVersion.FileVersion -ne $expectedVersion) {
            throw "Unexpected helper FileVersion: $($helperVersion.FileVersion)"
          }
          $expectedHelperOriginal = "SMU-Update-Helper-V$expectedVersion-Windows.exe"
          if ($helperVersion.OriginalFilename -ne $expectedHelperOriginal) {
            throw "Unexpected helper OriginalFilename: $($helperVersion.OriginalFilename)"
          }
      - name: Package unsigned Rust Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/rust-windows-release | Out-Null
          $bundle = "build/rust-windows-release/Spencer-Macro-Utilities-Rust-Windows-unsigned.zip"
          python scripts/package_rust_windows_bundle.py `
            --root . `
            --stage-dir build/rust-windows-app `
            --output $bundle
          $version = (Get-Content -Raw version).Trim()
          $assetName = Split-Path -Leaf $bundle
          python scripts/generate_update_manifest.py `
            --release-dir build/rust-windows-release `
            --version $version `
            --output build/rust-windows-release/update-manifest-rust-windows.json `
            --windows-asset $assetName `
            --only-platform windows-x64
      - name: Validate unsigned Rust Windows release bundle contract
        shell: pwsh
        run: |
          $bundle = "build/rust-windows-release/Spencer-Macro-Utilities-Rust-Windows-unsigned.zip"
          $verify = "build/rust-windows-release-verify"
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $bundle -DestinationPath $verify
          $root = "$verify/Spencer-Macro-Utilities"
          @(
            "$root/Spencer-Macro-Utilities.exe",
            "$root/SMU-Update-Helper.exe",
            "$root/SDL3.dll",
            "$root/SMCWinDivert.dll",
            "$root/SMCWinDivert64.sys",
            "$root/assets/LSANS.TTF",
            "$root/README.md",
            "$root/LICENSE",
            "$root/PRIVACY.md",
            "$root/THIRD_PARTY_NOTICES.md",
            "$root/licenses/SDL.txt",
            "$root/licenses/WinDivert-LGPL-3.0.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Missing Rust Windows release-bundle file: $_"
            }
          }
          $manifest = Get-Content -Raw build/rust-windows-release/update-manifest-rust-windows.json | ConvertFrom-Json
          $artifact = $manifest.artifacts.'windows-x64'
          if ($artifact.asset -ne (Split-Path -Leaf $bundle)) {
            throw "Rust Windows validation manifest references the wrong asset: $($artifact.asset)"
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()
          if ($artifact.sha256 -ne $actualHash) {
            throw "Rust Windows validation manifest SHA-256 does not match the bundle."
          }
      - name: Upload unsigned Rust Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-app-unsigned
          path: build/rust-windows-app
          if-no-files-found: error
      - name: Upload unsigned Rust Windows release-contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-release-contract-unsigned
          path: build/rust-windows-release
          if-no-files-found: error
